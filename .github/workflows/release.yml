name: Release

on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            asset_name: fritz-callhistory-linux-x86_64
          - os: windows-latest
            asset_name: fritz-callhistory-windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          # setuptools-scm needs full history and tags, otherwise the
          # version becomes 0.1.devN instead of the tag's version.
          fetch-depth: 0
          fetch-tags: true

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Check built version matches the tag
        shell: bash
        run: |
          uv run python - "${{ github.ref_name }}" <<'PY'
          import sys
          from importlib.metadata import version

          from packaging.version import Version

          built, tag = Version(version("fritz-callhistory")), Version(sys.argv[1])
          if built != tag:
              sys.exit(f"Built version {built} does not match tag {tag}")
          print(f"Version {built} matches tag {tag}")
          PY

      - name: Build executable
        run: uv run pyinstaller packaging/fritz_callhistory.spec

      - name: Rename artifact
        shell: bash
        # PyInstaller uses the spec's literal name="fritz-callhistory.exe" as
        # the output filename on every platform, it does not strip .exe on Linux.
        run: mv "dist/fritz-callhistory.exe" "dist/${{ matrix.asset_name }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.asset_name }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Extract changelog section for this version
        run: |
          scripts/changelog_section.sh "${{ github.ref_name }}" > release_notes.md
          cat release_notes.md

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Create SHA256SUMS
        run: |
          # Each artifact lands in a directory of the same name; move the binaries into a
          # separate directory (mv into "." would clash with that directory).
          mkdir release
          mv artifacts/fritz-callhistory-linux-x86_64/fritz-callhistory-linux-x86_64 release/
          mv artifacts/fritz-callhistory-windows-x86_64.exe/fritz-callhistory-windows-x86_64.exe release/
          cd release
          sha256sum fritz-callhistory-linux-x86_64 fritz-callhistory-windows-x86_64.exe > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          body_path: release_notes.md
          files: |
            release/fritz-callhistory-linux-x86_64
            release/fritz-callhistory-windows-x86_64.exe
            release/SHA256SUMS
