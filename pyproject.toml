[project]
name = "fritz-callhistory"
dynamic = ["version"]
description = "Durchsuchbare Anrufliste und Kontakt-Historie für die AVM Fritz!Box"
readme = "README.md"
authors = [
    { name = "jonny1797", email = "jonnys.kiste@web.de" }
]
requires-python = ">=3.12"
dependencies = [
    "fritzconnection>=1.15.1",
    "keyring>=25.7.0",
    "packaging>=24.0",
    "phonenumbers>=9.0.33",
    "platformdirs>=4.10.0",
    "pyside6>=6.11.1",
    "tomli-w>=1.2.0",
]

[project.scripts]
fritz-callhistory = "fritz_callhistory.app:main"

[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

# Die Version kommt ausschließlich aus dem Git-Tag (ADR 0001) - nie hier eintragen.
[tool.setuptools_scm]
fallback_version = "0.0.0"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fritz_callhistory = ["py.typed", "assets/*", "db/migrations/*.sql"]

[tool.uv]
# Editable-Install neu bauen, wenn sich Commit oder Tags ändern - sonst bleibt die Version veraltet.
cache-keys = [
    { file = "pyproject.toml" },
    { git = { commit = true, tags = true } },
]

[dependency-groups]
dev = [
    "pyinstaller>=6.21.0",
    "pytest>=9.1.1",
    "pytest-mock>=3.15.1",
    "pytest-qt>=4.5.0",
    "ruff>=0.15.20",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
